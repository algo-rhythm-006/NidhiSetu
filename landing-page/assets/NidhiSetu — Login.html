<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NidhiSetu — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#04040A;font-family:'Comfortaa','Trebuchet MS',sans-serif;color:#100F26;overflow:hidden}
.page{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;background:#fff;--c1:#453F8C;--c2:#100F26;--c3:#A6A3DC}
.left{padding:44px 8% 36px;display:flex;flex-direction:column;overflow:auto}
.logo{font-size:26px;font-weight:500}
.form{margin:auto 0;width:100%;max-width:400px;align-self:center;padding:24px 0}
.tag{font-size:12px;color:#746FB9;display:flex;gap:8px;align-items:center;margin-bottom:18px}
.tag i{width:7px;height:7px;border-radius:50%;background:#2fbf71}
h1{font-size:34px;font-weight:400;line-height:1.15}
h1 em{font-style:normal;color:var(--c1)}
.sub{font-size:13.5px;line-height:1.65;color:#746FB9;margin:10px 0 28px}
label{display:block;font-size:12px;color:#453F8C;margin-bottom:7px}
.f{margin-bottom:16px}
input{width:100%;font:inherit;font-size:14px;padding:14px 16px;border:1.5px solid #D4D3EE;border-radius:14px;outline:0;background:#F2F1FA;color:#100F26;transition:border-color .25s,box-shadow .25s}
input:focus{border-color:var(--c1);box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 16%,transparent)}
.row{display:flex;justify-content:space-between;font-size:12px;color:#746FB9;margin:4px 0 22px}
.row a,.alt a{color:var(--c1);text-decoration:none}
.cta{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;cursor:pointer;font:inherit;font-size:15px;color:#fff;background:#100F26;padding:7px 7px 7px 26px;border-radius:999px}
.cta span{width:44px;height:44px;border-radius:50%;background:#fff;color:#100F26;display:grid;place-items:center}
.alt{font-size:12px;color:#8b88a8;text-align:center;margin-top:20px}
.foot{font-size:11px;color:#9a97b5}
.right{position:relative;margin:14px 14px 14px 0;border-radius:28px;overflow:hidden;background:#04040A;display:grid;place-items:center}
.bg{position:absolute;inset:0;width:100%;height:100%}
.orbit{position:relative;width:min(400px,74%,58vh);aspect-ratio:1}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(212,211,238,.2)}
.ring.in{inset:17%;border:1px dashed rgba(212,211,238,.22)}
.spin{position:absolute;inset:0}
.node{position:absolute;width:0;height:0}
.nb{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.08));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#F2F1FA;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 12px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .5s cubic-bezier(.2,.9,.3,1.2),background .4s,color .4s}
.nb:hover{transform:scale(1.1)}
.node.on .nb{transform:scale(1.28);background:#fff;color:var(--c1)}
.nb svg{width:22px;height:22px}
.lb{position:absolute;left:-60px;width:120px;top:42px;text-align:center;font-size:11px;letter-spacing:.5px;color:#D4D3EE;opacity:.55;transition:opacity .4s;pointer-events:none}
.node.on .lb{opacity:1;color:#fff;top:48px}
.core{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.3);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),rgba(255,255,255,.05) 70%),rgba(4,4,10,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 70px color-mix(in srgb,var(--c3) 55%,transparent)}
.core svg{position:absolute;width:38%;height:38%;color:#fff}
.pulse{position:absolute;inset:0;border-radius:50%;border:1px solid var(--c3)}
@media(max-width:860px){html,body{overflow:auto}.page{grid-template-columns:1fr;overflow:auto}.right{order:-1;margin:12px;min-height:440px}.left{padding:30px 24px}}
</style>
</head>
<body>
<div class="page" id="pg">
  <section class="left"><div class="logo">NidhiSetu</div><form class="form" id="fm"></form><div class="foot">© 2026 NidhiSetu · Protected by AI Sentinel</div></section>
  <section class="right">
    <svg class="bg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c3);stop-opacity:.9"/></linearGradient>
        <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c3);stop-opacity:.8"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient>
        <radialGradient id="g3" cx=".5" cy=".5" r=".75"><stop offset="0" style="stop-color:var(--c1);stop-opacity:.75"/><stop offset="1" stop-color="#04040A" stop-opacity="0"/></radialGradient>
        <filter id="bl"><feGaussianBlur stdDeviation="14"/></filter>
      </defs>
      <rect width="600" height="800" fill="#04040A"/><rect width="600" height="800" fill="url(#g3)"/>
      <g class="rib" filter="url(#bl)" opacity=".8"><path d="M-80 640C80 470 190 740 330 560S560 430 700 300V900H-80Z" fill="url(#g2)"/></g>
      <g class="rib"><path d="M-60 520C90 380 170 640 320 470S540 330 680 210" fill="none" stroke="url(#g1)" stroke-width="40" stroke-linecap="round" opacity=".75"/>
      <path d="M-70 450C70 320 180 560 310 400S520 250 680 140" fill="none" stroke="url(#g2)" stroke-width="12" stroke-linecap="round" opacity=".7"/></g>
    </svg>
    <div class="orbit" id="orbit">
      <div class="ring"></div><div class="ring in" id="dash"></div>
      <div class="core" id="core"><div class="pulse" id="pulse"></div></div>
      <div class="spin" id="spin"></div>
    </div>
  </section>
</div>
<script>
const I={
 college:'<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',
 admin:'<path d="M6 11h12v9H6zM8 11V8a4 4 0 018 0v3"/>',
 professional:'<path d="M4 8h16v11H4zM9 8V5h6v3M4 13h16"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const R={
 college:{n:'College',c1:'#453F8C',c2:'#100F26',c3:'#A6A3DC',t:['College','Login'],sub:'Submit FDRs, track verification status and manage lifecycle alerts for your institution.',f:[['Institution ID','text','AICTE-XXXXXX'],['Password','password','Enter your password']]},
 admin:{n:'Admin',c1:'#746FB9',c2:'#25224F',c3:'#D4D3EE',t:['Administrator','Login'],sub:'Review AI Sentinel flags, oversee verifications and manage regulatory workflows.',f:[['Official email','email','name@aicte.gov'],['Password','password','Enter your password'],['Access code','text','6-digit code']]},
 professional:{n:'Professional',c1:'#25224F',c2:'#04040A',c3:'#746FB9',t:['Professional','Login'],sub:'For auditors, chartered accountants and bank officers verifying FDR records.',f:[['Registration number','text','Membership or licence no.'],['Password','password','Enter your password']]}
};
const keys=Object.keys(R),$=s=>document.querySelector(s),pg=$('#pg'),spin=$('#spin'),st={rot:0};
let cur=0,busy=false;
// nodes on the orbit
keys.forEach((k,i)=>{
  const a=(45+i*120)*Math.PI/180,n=document.createElement('div');n.className='node';
  n.style.left=50+50*Math.cos(a)+'%';n.style.top=50+50*Math.sin(a)+'%';
  n.innerHTML=`<button class="nb" aria-label="Login as ${R[k].n}">${svg(k)}</button><div class="lb">${R[k].n}</div>`;
  n.querySelector('button').onclick=()=>pick(i);spin.appendChild(n);
});
const nodes=[...document.querySelectorAll('.node')];
$('#core').insertAdjacentHTML('beforeend',svg('college'));
function applyRot(){spin.style.transform=`rotate(${st.rot}deg)`;nodes.forEach(n=>n.querySelector('.nb').parentNode.style.transform=`rotate(${-st.rot}deg)`)}
function form(k,anim){
  const r=R[k];
  $('#fm').innerHTML=`<div class="tag a"><i></i>AICTE Regulatory Oversight</div><h1 class="a">${r.t[0]} <em>${r.t[1]}</em></h1><p class="sub a">${r.sub}</p>
  ${r.f.map(f=>`<div class="f a"><label>${f[0]}</label><input type="${f[1]}" placeholder="${f[2]}" required></div>`).join('')}
  <div class="row a"><span>Keep me signed in</span><a href="#">Forgot password?</a></div>
  <button class="cta a" type="submit">Sign in<span>↗</span></button><p class="alt a">Need access? <a href="#">Request onboarding</a></p>`;
  if(anim)gsap.from('.a',{y:18,opacity:0,duration:.7,stagger:.06,ease:'power3.out'});
}
function mark(){nodes.forEach((n,i)=>n.classList.toggle('on',i===cur))}
function pick(i){
  if(busy||i===cur)return;busy=true;cur=i;const k=keys[i],r=R[k];mark();
  const target=-i*120,delta=((target-st.rot+540)%360)-180;
  const tl=gsap.timeline({onComplete:()=>busy=false});
  tl.to('.a',{y:-14,opacity:0,duration:.28,stagger:.025,ease:'power2.in'},0)
    .to(st,{rot:st.rot+delta,duration:1.2,ease:'power3.inOut',onUpdate:applyRot},0)
    .to(pg,{'--c1':r.c1,'--c2':r.c2,'--c3':r.c3,duration:1.2,ease:'power2.inOut'},0)
    .to('#core svg',{scale:.4,opacity:0,rotate:-40,duration:.35,ease:'power2.in'},0)
    .add(()=>{form(k,true);$('#core svg').innerHTML=I[k]},.4)
    .fromTo('#core svg',{scale:.4,opacity:0,rotate:40},{scale:1,opacity:1,rotate:0,duration:.6,ease:'back.out(2)'},.45);
}
$('#fm').onsubmit=e=>e.preventDefault();
form('college',false);mark();applyRot();
// intro + idle motion
gsap.from('.a',{y:18,opacity:0,duration:.7,stagger:.06,ease:'power3.out',delay:.1});
gsap.from('.ring',{scale:.7,opacity:0,duration:1.2,ease:'power3.out',stagger:.15});
gsap.from('.core',{scale:.5,opacity:0,duration:1,ease:'back.out(1.6)',delay:.2});
gsap.from('.nb',{scale:0,duration:.8,ease:'back.out(2)',stagger:.12,delay:.5,clearProps:'transform'});
gsap.to('#dash',{rotation:360,duration:60,repeat:-1,ease:'none'});
gsap.to('.rib',{y:-18,x:10,duration:5,yoyo:true,repeat:-1,ease:'sine.inOut',stagger:.6});
gsap.to('#pulse',{scale:1.6,opacity:0,duration:2.4,repeat:-1,ease:'power1.out'});
</script>
</body>
</html>
