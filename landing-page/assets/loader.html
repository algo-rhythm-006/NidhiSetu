<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NidhiSetu Loader</title>
<style>
  :root {
    --bg: #f7f8fa;
    --ink: #111318;
    --muted: #737985;
    --line: rgba(17, 19, 24, .10);
    --accent: #536b8c;
    --total: 5s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #ns-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse 38% 34% at 50% 42%, rgba(255,255,255,.98), rgba(255,255,255,0) 100%),
      linear-gradient(145deg, #fbfcfd 0%, #f4f6f9 100%);
    animation: overlayOut .55s cubic-bezier(.4,0,.2,1) 4.45s forwards;
  }

  /* Quiet ambient light: no metallic or gold effects */
  #ns-loader::before {
    content: "";
    position: absolute;
    width: min(74vw, 620px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(90,112,145,.075), rgba(90,112,145,0) 68%);
    filter: blur(12px);
    opacity: 0;
    animation: ambientIn 1.2s ease-out .2s forwards;
  }

  .stack {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px;
    transform: translateY(-1.5vh);
  }

  .logo-wrap {
    position: relative;
    width: clamp(112px, 16vw, 142px);
    height: clamp(112px, 16vw, 142px);
    margin-bottom: 30px;
    perspective: 800px;
  }

  .logo {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    opacity: 0;
    transform: translateY(16px) scale(.88);
    filter: drop-shadow(0 14px 24px rgba(18, 25, 38, .13));
    animation: logoIn 1.05s cubic-bezier(.16,1,.3,1) .15s forwards,
               logoSettle .8s ease-out 2.55s forwards;
  }

  .shield {
    fill: none;
    stroke: #fff;
    stroke-width: 86;
    stroke-linejoin: round;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    opacity: 0;
    animation: draw 1.25s cubic-bezier(.65,0,.25,1) .55s forwards;
  }

  .sprout {
    fill: #fff;
    stroke: #fff;
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transform: scale(.72);
    opacity: 0;
    animation: grow .75s cubic-bezier(.2,.9,.25,1) 1.55s forwards;
  }

  .arm { fill: none; stroke: #fff; stroke-width: 78; stroke-linecap: round; }

  .shine {
    transform: translateX(-1500px) skewX(-18deg);
    animation: shine 1s ease-in-out 2.2s forwards;
  }

  .eyebrow {
    margin-bottom: 11px;
    color: #7b8492;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .22em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp .65s ease-out 1.9s forwards;
  }

  .name {
    display: flex;
    overflow: hidden;
    padding: 3px 2px 7px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: clamp(38px, 7vw, 54px);
    font-weight: 700;
    letter-spacing: -.065em;
    line-height: 1;
  }

  .name span {
    display: inline-block;
    transform: translateY(115%);
    opacity: 0;
    animation: letterUp .62s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay: calc(2.15s + var(--i) * .045s);
  }

  .name .accent { color: var(--ink); }

  .rule {
    width: 0;
    height: 1px;
    margin: 18px 0 17px;
    background: linear-gradient(90deg, transparent, rgba(83,107,140,.55), transparent);
    animation: rule .8s ease-out 2.85s forwards;
  }

  .tagline {
    max-width: 460px;
    color: var(--muted);
    font-size: clamp(13px, 2.2vw, 15px);
    font-weight: 400;
    letter-spacing: -.012em;
    line-height: 1.75;
  }

  .tagline .w {
    display: inline-block;
    opacity: 0;
    transform: translateY(7px);
    filter: blur(3px);
    animation: wordIn .5s ease-out forwards;
    animation-delay: calc(2.95s + var(--i) * .035s);
  }

  .tagline .line2 { display: block; margin-top: 1px; }
  .tagline .strong { color: #252a33; font-weight: 600; }

  .progress {
    position: relative;
    width: 154px;
    height: 2px;
    margin-top: 32px;
    overflow: hidden;
    border-radius: 10px;
    background: rgba(17,19,24,.09);
    opacity: 0;
    animation: fadeIn .45s ease-out .35s forwards;
  }

  .progress i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #9aa9bc, #354b68);
    animation: bar 4.1s cubic-bezier(.45,.05,.25,1) .35s forwards;
  }

  @keyframes logoIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes logoSettle { to { filter: drop-shadow(0 10px 20px rgba(18,25,38,.11)); } }
  @keyframes draw { to { opacity: 1; stroke-dashoffset: 0; } }
  @keyframes grow { to { transform: scale(1); opacity: 1; } }
  @keyframes shine { to { transform: translateX(1700px) skewX(-18deg); } }
  @keyframes letterUp { to { transform: translateY(0); opacity: 1; } }
  @keyframes rule { to { width: min(230px, 58vw); } }
  @keyframes wordIn { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes bar { to { width: 100%; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  @keyframes ambientIn { to { opacity: 1; } }
  @keyframes overlayOut { to { opacity: 0; visibility: hidden; } }

  /* Demo page behind the loader — remove in production */
  .demo {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .demo h1 { font-size: 34px; font-weight: 650; letter-spacing: -.05em; }
  .demo button {
    font: 550 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 11px 22px;
    border: 1px solid #171a20;
    border-radius: 999px;
    background: #171a20;
    color: #fff;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .demo button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.12); }

  @media (max-width: 480px) {
    .stack { padding: 22px; }
    .logo-wrap { margin-bottom: 26px; }
    .tagline { max-width: 330px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #ns-loader *, #ns-loader::before {
      animation-duration: .01s !important;
      animation-delay: 0s !important;
    }
    #ns-loader { animation: overlayOut .3s ease 1.2s forwards; }
  }
</style>
</head>
<body>

<!-- ============ NIDHISETU LOADER (copy from here) ============ -->
<div id="ns-loader" aria-label="Loading NidhiSetu" role="status">
  <div class="stack">
    <div class="logo-wrap">
      <div class="halo"></div>
      <svg class="logo" viewBox="0 0 1254 1254" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <clipPath id="tileClip"><rect width="1254" height="1254" rx="235"/></clipPath>
          <linearGradient id="shineGrad" x1="0" x2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".28"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect width="1254" height="1254" rx="235" fill="#000"/>

        <!-- Shield -->
        <path class="shield" pathLength="1"
          d="M627 188 C760 250 890 295 1016 335 L1016 520 C1016 745 935 885 745 985 Q685 1015 627 1030 Q569 1015 509 985 C319 885 238 745 238 520 L238 335 C364 295 494 250 627 188 Z"/>

        <!-- Sprout -->
        <g class="sprout">
          <path d="M627 382 Q637 382 640 410 L655 600 L599 600 L614 410 Q617 382 627 382 Z" stroke-width="2"/>
          <line class="arm" x1="438" y1="535" x2="598" y2="660"/>
          <line class="arm" x1="817" y1="535" x2="658" y2="660"/>
          <path d="M572 690 L682 690 L660 800 Q627 850 594 800 Z" stroke-width="30" stroke-linejoin="round"/>
        </g>

        <!-- Shine sweep -->
        <g clip-path="url(#tileClip)">
          <rect class="shine" x="0" y="-200" width="260" height="1700" fill="url(#shineGrad)"/>
        </g>
      </svg>
    </div>

    <div class="eyebrow">FDR VERIFICATION PLATFORM</div>\n    <h1 class="name" aria-label="NidhiSetu">
      <span style="--i:0">N</span><span style="--i:1">i</span><span style="--i:2">d</span><span style="--i:3">h</span><span style="--i:4">i</span><span class="accent" style="--i:5">S</span><span class="accent" style="--i:6">e</span><span class="accent" style="--i:7">t</span><span class="accent" style="--i:8">u</span>
    </h1>

    <div class="rule"></div>

    <p class="tagline">
      <span><span class="w" style="--i:0">Because</span> <span class="w" style="--i:1">every</span> <span class="w" style="--i:2">FDR</span> <span class="w" style="--i:3">deserves</span> <span class="w" style="--i:4">more</span> <span class="w" style="--i:5">than</span> <span class="w" style="--i:6">a</span> <span class="w" style="--i:7">glance,</span></span>
      <span class="line2 strong"><span class="w" style="--i:9">it</span> <span class="w" style="--i:10">deserves</span> <span class="w" style="--i:11">verification.</span></span>
    </p>

    <div class="progress"><i></i></div>
  </div>
</div>

<script>
  // Remove loader from the DOM once the 5s sequence ends
  window.addEventListener('load', function () {
    var el = document.getElementById('ns-loader');
    setTimeout(function () { if (el) el.remove(); }, 5000);
  });
</script>
<!-- ============ (copy to here) ============ -->

<!-- Demo page content (delete in production) -->
<div class="demo">
  <h1>NidhiSetu</h1>
  <button onclick="location.reload()">Replay loader</button>
</div>

</body>
</html>
